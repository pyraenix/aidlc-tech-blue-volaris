<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .svc{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle;}
      .svcsub{font-size:10px;fill:#fff;text-anchor:middle;}
      .grp{font-size:13px;font-weight:bold;fill:#232f3e;}
      .flow{font-size:11px;fill:#444;}
      .note{font-size:10px;fill:#666;}
      .ext{font-size:12px;font-weight:bold;fill:#232f3e;text-anchor:middle;}
      .extsub{font-size:10px;fill:#555;text-anchor:middle;}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#137333"/></marker>
  </defs>

  <rect width="1440" height="900" fill="#f7f9fb"/>
  <text x="40" y="40" font-size="23" font-weight="bold" fill="#232f3e">Property Onboarding — Integration Component (UK ecosystem, eu-west-2)</text>
  <text x="40" y="62" class="note">This onboarding app is one component of a larger property platform. It integrates over REST with an in-house video agent, an upstream EPC/compliance data app, and an existing publishing app.</text>

  <!-- ===== EXTERNAL SYSTEMS (dashed) ===== -->
  <rect x="40" y="90" width="1360" height="86" rx="8" fill="#fef7e6" stroke="#e0b400" stroke-dasharray="6 4"/>
  <text x="52" y="110" class="grp">External systems in the ecosystem (owned elsewhere — integrated via REST)</text>
  <rect x="70" y="118" width="360" height="46" rx="6" fill="#fff" stroke="#e0b400"/>
  <text x="250" y="138" class="ext">Upstream data app</text><text x="250" y="154" class="extsub">EPC certificate · compliance data  (we GET)</text>
  <rect x="540" y="118" width="360" height="46" rx="6" fill="#fff" stroke="#e0b400"/>
  <text x="720" y="138" class="ext">In-house video→image agent</text><text x="720" y="154" class="extsub">frame extraction / snapshots  (we POST)</text>
  <rect x="1010" y="118" width="360" height="46" rx="6" fill="#fff" stroke="#e0b400"/>
  <text x="1190" y="138" class="ext">Existing publishing app</text><text x="1190" y="154" class="extsub">distributes to rental sites  (we POST)</text>

  <!-- ===== CLIENT / EDGE ===== -->
  <rect x="40" y="200" width="300" height="330" rx="8" fill="#eef3f8" stroke="#c7d5e0"/>
  <text x="52" y="220" class="grp">Client &amp; Edge</text>
  <rect x="60" y="232" width="120" height="60" rx="6" fill="#c8511b"/><text x="120" y="255" class="svc">S3+CloudFront</text><text x="120" y="271" class="svcsub">Owner SPA</text><text x="120" y="284" class="svcsub">(Node.js)</text>
  <rect x="200" y="232" width="120" height="60" rx="6" fill="#c8511b"/><text x="260" y="255" class="svc">S3+CloudFront</text><text x="260" y="271" class="svcsub">Reviewer SPA</text><text x="260" y="284" class="svcsub">console</text>
  <rect x="60" y="305" width="260" height="46" rx="6" fill="#d13212"/><text x="190" y="325" class="svc">AWS WAF</text><text x="190" y="341" class="svcsub">rate limits · managed rules · OTP throttle</text>
  <rect x="60" y="364" width="260" height="58" rx="6" fill="#dd344c"/><text x="190" y="386" class="svc">Cognito email-OTP</text><text x="190" y="402" class="svcsub">passwordless 6-digit + SES</text><text x="190" y="415" class="svcsub">JWT issuer</text>
  <rect x="60" y="434" width="260" height="40" rx="6" fill="#c925d1"/><text x="190" y="459" class="svc">ElastiCache Redis — in-journey draft (TTL)</text>

  <!-- ===== API ===== -->
  <rect x="360" y="200" width="250" height="330" rx="8" fill="#eef3f8" stroke="#c7d5e0"/>
  <text x="372" y="220" class="grp">API Layer</text>
  <rect x="378" y="232" width="216" height="56" rx="6" fill="#e7157b"/><text x="486" y="254" class="svc">API Gateway (HTTP)</text><text x="486" y="270" class="svcsub">Cognito JWT authorizer</text><text x="486" y="283" class="svcsub">/presign /submit /review</text>
  <rect x="378" y="300" width="216" height="46" rx="6" fill="#ed7100"/><text x="486" y="320" class="svc">presign-upload</text><text x="486" y="335" class="svcsub">short-lived S3 PUT</text>
  <rect x="378" y="356" width="216" height="46" rx="6" fill="#ed7100"/><text x="486" y="376" class="svc">review-callback</text><text x="486" y="391" class="svcsub">SendTaskSuccess/Failure</text>
  <rect x="378" y="412" width="216" height="52" rx="6" fill="#7aa116"/><text x="486" y="433" class="svc">S3 raw-videos</text><text x="486" y="449" class="svcsub">KMS · presigned · EventBridge on</text>

  <!-- ===== ORCHESTRATION ===== -->
  <rect x="630" y="200" width="440" height="470" rx="8" fill="#eef3f8" stroke="#c7d5e0"/>
  <text x="642" y="220" class="grp">Orchestration &amp; Integration</text>
  <rect x="648" y="232" width="404" height="42" rx="6" fill="#e7157b"/><text x="850" y="252" class="svc">EventBridge</text><text x="850" y="267" class="svcsub">S3 ObjectCreated → Step Functions</text>

  <rect x="648" y="288" width="404" height="336" rx="6" fill="#fff" stroke="#cd2264" stroke-width="2"/>
  <rect x="648" y="288" width="404" height="28" rx="6" fill="#cd2264"/><text x="850" y="307" class="svc">AWS Step Functions — HITL workflow</text>

  <rect x="668" y="324" width="364" height="42" rx="5" fill="#ed7100"/><text x="850" y="343" class="svc">fetch-input-data  →  Upstream data app (REST)</text><text x="850" y="357" class="svcsub">EPC + compliance</text>
  <rect x="668" y="374" width="364" height="42" rx="5" fill="#ed7100"/><text x="850" y="393" class="svc">invoke-video-agent  →  In-house agent (REST)</text><text x="850" y="407" class="svcsub">returns snapshots</text>
  <rect x="668" y="424" width="364" height="42" rx="5" fill="#01a88d"/><text x="850" y="443" class="svc">generate-description — Bedrock Claude</text><text x="850" y="457" class="svcsub">vision → strict JSON + PII/compliance</text>
  <rect x="668" y="474" width="364" height="42" rx="5" fill="#ed7100"/><text x="850" y="493" class="svc">waitForTaskToken → human review</text><text x="850" y="507" class="svcsub">pauses up to 7 days</text>
  <rect x="668" y="524" width="176" height="42" rx="5" fill="#527fff"/><text x="756" y="543" class="svc">DynamoDB</text><text x="756" y="557" class="svcsub">listing state</text>
  <rect x="856" y="524" width="176" height="42" rx="5" fill="#dd344c"/><text x="944" y="543" class="svc">SNS</text><text x="944" y="557" class="svcsub">owner/ops notify</text>
  <rect x="668" y="574" width="364" height="40" rx="5" fill="#7d8998"/><text x="850" y="599" class="svc">Secrets Manager — external base URLs + API keys</text>

  <!-- ===== PUBLISH HANDOFF ===== -->
  <rect x="1090" y="200" width="310" height="470" rx="8" fill="#eef3f8" stroke="#c7d5e0"/>
  <text x="1102" y="220" class="grp">Publish hand-off</text>
  <rect x="1110" y="234" width="270" height="46" rx="6" fill="#e7157b"/><text x="1245" y="254" class="svc">EventBridge</text><text x="1245" y="270" class="svcsub">ListingApproved</text>
  <rect x="1110" y="296" width="270" height="56" rx="6" fill="#ed7100"/><text x="1245" y="318" class="svc">publish-to-ecosystem</text><text x="1245" y="334" class="svcsub">POST approved listing →</text><text x="1245" y="346" class="svcsub">existing publishing app (REST)</text>
  <rect x="1110" y="366" width="270" height="44" rx="6" fill="#c925d1"/><text x="1245" y="391" class="svc">SQS DLQ — failed hand-offs</text>

  <!-- ===== CROSS-CUTTING ===== -->
  <rect x="40" y="694" width="1360" height="66" rx="8" fill="#eef3f8" stroke="#c7d5e0"/>
  <text x="52" y="714" class="grp">Cross-cutting</text>
  <rect x="60" y="724" width="170" height="28" rx="4" fill="#e7157b"/><text x="145" y="743" class="svc">CloudWatch + X-Ray</text>
  <rect x="242" y="724" width="120" height="28" rx="4" fill="#dd344c"/><text x="302" y="743" class="svc">CloudTrail</text>
  <rect x="374" y="724" width="120" height="28" rx="4" fill="#dd344c"/><text x="434" y="743" class="svc">GuardDuty</text>
  <rect x="506" y="724" width="90" height="28" rx="4" fill="#dd344c"/><text x="551" y="743" class="svc">KMS</text>
  <rect x="608" y="724" width="170" height="28" rx="4" fill="#5c4ee5"/><text x="693" y="743" class="svc">IAM least-privilege</text>
  <rect x="790" y="724" width="180" height="28" rx="4" fill="#844fba"/><text x="880" y="743" class="svc">VPC (private Redis)</text>
  <rect x="982" y="724" width="210" height="28" rx="4" fill="#5c4ee5"/><text x="1087" y="743" class="svc">Terraform (stage→prod)</text>
  <rect x="1204" y="724" width="176" height="28" rx="4" fill="#137333"/><text x="1292" y="743" class="svc">UK data residency</text>

  <!-- ===== FLOW ===== -->
  <rect x="40" y="778" width="1360" height="110" rx="8" fill="#fff" stroke="#c7d5e0"/>
  <text x="52" y="799" class="grp">Flow</text>
  <text x="52" y="820" class="flow">1. Owner signs in (Cognito email-OTP). In-journey wizard state in Redis. Owner uploads video via presigned S3 PUT. S3 event → EventBridge → Step Functions.</text>
  <text x="52" y="839" class="flow">2. fetch-input-data pulls EPC/compliance from the upstream app (REST). invoke-video-agent calls the in-house agent (REST) for snapshots. Bedrock Claude writes the JSON description.</text>
  <text x="52" y="858" class="flow">3. Draft saved to DynamoDB (PENDING_REVIEW); workflow pauses on waitForTaskToken. Reviewer approves/rejects → review-callback resumes it.</text>
  <text x="52" y="877" class="flow">4. On approve → ListingApproved → publish-to-ecosystem POSTs the reviewed listing to the existing publishing app (REST); failures dead-letter to SQS. SNS notifies the owner.</text>

  <!-- arrows to external -->
  <line x1="850" y1="324" x2="250" y2="166" stroke="#137333" stroke-width="1.5" marker-end="url(#arG)"/>
  <line x1="850" y1="374" x2="720" y2="166" stroke="#137333" stroke-width="1.5" marker-end="url(#arG)"/>
  <line x1="1245" y1="296" x2="1190" y2="166" stroke="#137333" stroke-width="1.5" marker-end="url(#arG)"/>
  <line x1="1052" y1="256" x2="1108" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
